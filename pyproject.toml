[project]
name = "mi-centro-de-control"
version = "0.1.0"
description = "Finanzas personales, pendientes y metas"
requires-python = ">=3.12"
# Mismas versiones que requirements.txt (tests/test_proyecto.py verifica que coincidan)
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "python-multipart==0.0.33",
    "argon2-cffi==25.1.0",
    "pyotp==2.12.0",
    "itsdangerous==2.2.0",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "tzdata==2026.6",
    "anthropic==2.9.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
]

# Vercel: la app FastAPI está en app/main.py; en cada despliegue se aplican las migraciones
[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python -m alembic upgrade head"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # SQLite guarda NUMERIC como número de punto flotante; en producción (PostgreSQL) es exacto
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively:Warning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
