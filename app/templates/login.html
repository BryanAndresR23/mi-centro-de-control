<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Mi Centro de Control</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/iconos/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ VERSION }}">
</head>
<body class="pagina-login">
  <main class="tarjeta">
    <div class="marca"><img src="/static/iconos/icono.svg" alt=""> Mi Centro de Control</div>
    {% if error %}<div class="aviso aviso-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="formulario">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="siguiente" value="{{ siguiente }}">
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      {% if usa_2fa %}
      <div class="campo">
        <label for="codigo">Código de Google Authenticator</label>
        <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9 ]{6,7}" maxlength="7" placeholder="123 456" required>
      </div>
      {% endif %}
      <button class="boton boton-ancho" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
